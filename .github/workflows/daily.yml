# 部署到 GitHub Pages + Actions 的工作流
#
# 每日15:30(北京时间)定时执行:
# 1. 对账旧预测 + 运行模型生成今日新预测
# 2. 用GitHub API上传数据文件(绕开git push被企业安全拦截)
# 3. 构建前端 + 部署到GitHub Pages

name: 每日预测与对账

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install numpy pandas matplotlib requests -q

      - name: 拉取历史数据
        run: |
          # 从仓库data目录拉取已有的历史数据到本地data目录
          mkdir -p data
          python -c "
          import urllib.request, json, base64, os
          TOKEN = os.environ['GITHUB_TOKEN']
          REPO = os.environ['GITHUB_REPOSITORY']
          def gh(path):
              url = f'https://api.github.com/repos/{REPO}{path}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {TOKEN}',
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())
          # 拉取winrate_history.json
          try:
              data = gh('/contents/data/winrate_history.json')
              content = base64.b64decode(data['content'])
              with open('data/winrate_history.json', 'wb') as f:
                  f.write(content)
              print(f'已拉取 winrate_history.json ({len(content)} bytes)')
          except Exception as e:
              print(f'winrate_history.json 不存在或拉取失败: {e}')
          # 拉取predictions目录
          try:
              items = gh('/contents/data/predictions')
              os.makedirs('data/predictions', exist_ok=True)
              for item in items:
                  if item['type'] == 'file':
                      d = gh(f'/contents/{item[\"path\"]}')
                      content = base64.b64decode(d['content'])
                      with open(item['path'], 'wb') as f:
                          f.write(content)
                      print(f'已拉取 {item[\"name\"]}')
          except Exception as e:
              print(f'predictions目录不存在或拉取失败: {e}')
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 对账旧预测 + 生成新预测
        run: |
          python -m nextday.main
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 用GitHub API上传数据文件
        run: |
          python -c "
          import json, base64, os, urllib.request, urllib.error, glob
          TOKEN = os.environ['GITHUB_TOKEN']
          REPO = os.environ['GITHUB_REPOSITORY']
          BRANCH = os.environ.get('GITHUB_REF_NAME', 'master')
          
          def gh_upload(filepath, repo_path, message):
              with open(filepath, 'rb') as f:
                  content = base64.b64encode(f.read()).decode()
              # 检查文件是否已存在
              url = f'https://api.github.com/repos/{REPO}/contents/{repo_path}'
              sha = None
              try:
                  req = urllib.request.Request(url, headers={
                      'Authorization': f'Bearer {TOKEN}',
                      'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.loads(r.read().decode())
                      sha = d.get('sha')
              except urllib.error.HTTPError:
                  pass
              payload = json.dumps({
                  'message': message, 'content': content, 'branch': BRANCH,
                  **({'sha': sha} if sha else {})
              }).encode()
              req = urllib.request.Request(url, data=payload, method='PUT',
                  headers={'Authorization': f'Bearer {TOKEN}',
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  print(f'OK: {repo_path}')
          
          # 上传data目录下所有文件
          for root, dirs, files in os.walk('data'):
              for fn in files:
                  fp = os.path.join(root, fn)
                  repo_path = os.path.join('data', os.path.relpath(fp, 'data')).replace(os.sep, '/')
                  gh_upload(fp, repo_path, f'daily: update {repo_path}')
          
          # 更新manifest
          preds = glob.glob('data/predictions/pred_*.json')
          dates = sorted([os.path.basename(f).replace('pred_','').replace('.json','') for f in preds])
          manifest = json.dumps({'dates': dates}, indent=2)
          manifest_b64 = base64.b64encode(manifest.encode()).decode()
          url = f'https://api.github.com/repos/{REPO}/contents/data/predictions/manifest.json'
          sha = None
          try:
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {TOKEN}',
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  sha = json.loads(r.read().decode()).get('sha')
          except: pass
          payload = json.dumps({
              'message': 'daily: update manifest',
              'content': manifest_b64, 'branch': BRANCH,
              **({'sha': sha} if sha else {})
          }).encode()
          req = urllib.request.Request(url, data=payload, method='PUT',
              headers={'Authorization': f'Bearer {TOKEN}',
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=60) as r:
              print('OK: manifest.json')
          print('数据上传完成')
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建前端
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
