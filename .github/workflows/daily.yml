# 部署到 GitHub Pages + Actions 的工作流
#
# 每日15:30(北京时间)定时执行:
# 1. 构建前端(Vite build)
# 2. 部署到 GitHub Pages

name: 每日预测与对账

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30
    - cron: '30 7 * * 1-5'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建前端
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
